<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src fiso-audio:; connect-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FISO Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <button class="brand" id="tb-home" type="button">
          <img class="brand-icon" src="brand-icon.png" alt="" width="30" height="30" />
          <span><b>FISO</b> Explorer</span>
        </button>
        <div class="topbar-actions">
          <button class="btn ghost icon-btn" id="tb-settings" type="button"></button>
          <button class="btn ghost icon-btn" id="tb-help" type="button"></button>
        </div>
      </header>
      <main class="main">
        <div id="view" class="view"></div>
      </main>
      <footer class="player" id="player" hidden></footer>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <div class="dropzone" id="dropzone" hidden><div></div></div>
    <audio id="audio" preload="none"></audio>
    <script src="i18n/en.js"></script>
    <script src="i18n/fr.js"></script>
    <script src="i18n/es.js"></script>
    <script src="i18n/de.js"></script>
    <script src="i18n/pt.js"></script>
    <script src="i18n/it.js"></script>
    <script src="i18n/nl.js"></script>
    <script src="i18n/ja.js"></script>
    <script src="icons.js"></script>
    <script src="app.js"></script>
  </body>
</html>
